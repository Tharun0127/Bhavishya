# Daily scoring (after the forecast job) and the public site.
# The full leaderboard with 1,000-draw bootstrap intervals is rebuilt weekly and on demand;
# the daily run refreshes scores and the status page with the same code.
name: score-and-site

on:
  workflow_run:
    workflows: [daily-forecast]
    types: [completed]
  schedule:
    - cron: "30 3 * * 0"  # weekly leaderboard rebuild, Sunday 09:00 IST
  workflow_dispatch:

concurrency:
  group: arena-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: arena-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ".[arena]" mkdocs-material
      - name: Verify every forecast file against the manifest
        run: bhavishya verify
      - name: Score against first-released actuals
        run: bhavishya score
      - name: Commit scores
        working-directory: arena-data
        run: |
          git config user.name "bhavishya-bot"; git config user.email "bhavishya-bot@users.noreply.github.com"
          git add -A && git commit -m "scores: $(date -u +%F)" || echo "no new scores"
          git push
      - name: Build site and package docs
        run: |
          bhavishya site --out _site
          cp DATA_SOURCES.md docs/data_sources.md
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  deploy:
    needs: score
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
