# Daily cycle: fetch -> prepare -> one job per model -> commit hashed forecasts to the data branch.
# Runs at 05:45 UTC (11:15 IST): after Grid-India's morning report and CPCB's previous-evening bulletin.
name: daily-forecast

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "IST run date (default: today)"
        required: false

concurrency:
  group: arena-data  # only one job may write to the data branch at a time
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUN_DATE: ${{ inputs.run_date }}

jobs:
  fetch-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # push fetched data and inputs to the data branch
      issues: write    # open a health issue when a source is skipped
    outputs:
      run_date: ${{ steps.date.outputs.run_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: arena-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ".[arena]"
      - id: date
        run: echo "run_date=${RUN_DATE:-$(TZ=Asia/Kolkata date +%F)}" >> "$GITHUB_OUTPUT"
      - name: Fetch sources and record health
        run: bhavishya fetch --run-date ${{ steps.date.outputs.run_date }}
      - name: Open or update an issue for each skipped source
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          shopt -s nullglob
          for f in arena-data/health/open_issues/*.md; do
            src=$(basename "$f" .md); title="Source health: $src skipped"
            num=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
            if [ -n "$num" ]; then gh issue comment "$num" --body-file "$f"; else gh issue create --title "$title" --body-file "$f" --label source-health || gh issue create --title "$title" --body-file "$f"; fi
          done
      - name: Prepare model inputs (unhealthy sources are skipped)
        run: bhavishya prepare --respect-health --run-date ${{ steps.date.outputs.run_date }}
      - name: Commit fetched data and inputs to the data branch
        working-directory: arena-data
        run: |
          git config user.name "bhavishya-bot"; git config user.email "bhavishya-bot@users.noreply.github.com"
          git add -A && git commit -m "data: fetch and inputs for ${{ steps.date.outputs.run_date }}" || echo "nothing new"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ steps.date.outputs.run_date }}
          path: arena-data/raw/
          retention-days: 90
          if-no-files-found: ignore

  model:
    needs: fetch-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read  # models never get write access or secrets
    strategy:
      fail-fast: false  # one failing model must not cancel the others
      matrix:
        include:
          - { model: seasonal_naive, py: "3.12", extras: "baselines" }
          - { model: auto_ets, py: "3.12", extras: "baselines" }
          - { model: auto_arima, py: "3.12", extras: "baselines" }
          - { model: lightgbm, py: "3.12", extras: "baselines" }
          - { model: chronos2, py: "3.12", extras: "chronos" }
          - { model: timesfm2_5, py: "3.12", extras: "timesfm" }
          - { model: moirai2, py: "3.11", extras: "moirai" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: arena-data, sparse-checkout: "inputs/${{ needs.fetch-prepare.outputs.run_date }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.py }}", cache: pip }
      - name: Install CPU-only torch first, then the model extra
        run: |
          if [ "${{ matrix.model }}" = "moirai2" ]; then pip install "torch<2.5" --index-url https://download.pytorch.org/whl/cpu;
          elif [ "${{ matrix.extras }}" != "baselines" ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install ".[${{ matrix.extras }}]"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ matrix.model }}-${{ hashFiles('src/bhavishya/models/foundation.py') }}
      - name: Run model
        env:
          BHAVISHYA_PYTHON_MOIRAI: python
        run: bhavishya run-model --model ${{ matrix.model }} --python python --run-date ${{ needs.fetch-prepare.outputs.run_date }}
      - uses: actions/upload-artifact@v4
        with:
          name: staging-${{ matrix.model }}
          path: arena-data/staging/
          retention-days: 14

  submissions:
    # Merged outside models, run in the same Docker sandbox as in review (no network, resource caps).
    needs: fetch-prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: data, path: arena-data, persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install .
      - name: Run every merged submission
        run: |
          shopt -s nullglob
          for d in submissions/*/; do
            case "$(basename "$d")" in _*) continue;; esac
            bhavishya run-submission --path "$d" --run-date ${{ needs.fetch-prepare.outputs.run_date }} || echo "submission $d failed; recorded in its status"
          done
          mkdir -p arena-data/staging
      - uses: actions/upload-artifact@v4
        with:
          name: staging-submissions
          path: arena-data/staging/
          retention-days: 14
          if-no-files-found: ignore

  commit:
    needs: [fetch-prepare, model, submissions]
    if: ${{ always() && needs.fetch-prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: arena-data }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ".[arena]"
      - uses: actions/download-artifact@v4
        with: { pattern: "staging-*", path: arena-data/staging/, merge-multiple: true }
      - name: Merge, hash, add to manifest, timestamp
        run: bhavishya commit --run-date ${{ needs.fetch-prepare.outputs.run_date }}
      - name: Push forecasts before any outcome exists
        working-directory: arena-data
        run: |
          git config user.name "bhavishya-bot"; git config user.email "bhavishya-bot@users.noreply.github.com"
          git add -A && git commit -m "forecasts: ${{ needs.fetch-prepare.outputs.run_date }}"
          git push
