name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e ".[baselines,arena,dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: mypy (type-check once, on the version set in pyproject)
        if: matrix.python == '3.12'
        run: mypy
      - run: pytest -q
